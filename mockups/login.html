<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Supplier Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { marigold: '#FFB300', vermillion: '#C62828' },
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body class="bg-white flex flex-col h-screen">

    <div class="p-4 flex items-center">
        <a href="index.html" class="w-10 h-10 flex items-center justify-center bg-gray-50 rounded-full text-gray-600">
            <i class="fa-solid fa-arrow-left"></i>
        </a>
    </div>

    <div class="flex-1 px-6 pt-6">
        <div class="w-16 h-16 bg-red-50 text-vermillion rounded-2xl flex items-center justify-center text-3xl mb-6">
            <i class="fa-solid fa-store"></i>
        </div>
        <h1 class="text-3xl font-bold text-gray-900 leading-tight">Welcome back,<br>Supplier.</h1>
        <p class="text-sm text-gray-500 mt-2 font-medium">Enter your mobile number to manage your inventory</p>

        <div id="step-1" class="mt-8">
            <div class="flex rounded-xl border border-gray-300 overflow-hidden focus-within:border-vermillion focus-within:ring-2 focus-within:ring-vermillion/20 transition h-14">
                <span class="bg-gray-50 px-4 flex items-center justify-center text-gray-500 font-bold border-r border-gray-200">+91</span>
                <input type="tel" class="flex-1 px-4 bg-transparent outline-none text-gray-900 font-bold text-lg w-full" placeholder="98765 43210" pattern="[0-9]*" inputmode="numeric">
            </div>
            
            <button onclick="showOtp()" class="w-full bg-vermillion text-white font-bold py-4 rounded-xl mt-8 shadow-md shadow-red-200 active:scale-95 transition">
                Send OTP
            </button>
        </div>

        <div id="step-2" class="mt-8 hidden">
            <p class="text-xs font-bold text-gray-500 mb-4 uppercase tracking-wide">Enter 4-Digit Code</p>
            <div class="flex justify-between gap-3 mb-8">
                <input type="text" class="otp-input flex-1 h-16 text-center text-2xl font-bold border-2 border-gray-200 rounded-xl focus:border-vermillion outline-none bg-gray-50 focus:bg-white transition" maxlength="1" pattern="[0-9]*" inputmode="numeric">
                <input type="text" class="otp-input flex-1 h-16 text-center text-2xl font-bold border-2 border-gray-200 rounded-xl focus:border-vermillion outline-none bg-gray-50 focus:bg-white transition" maxlength="1" pattern="[0-9]*" inputmode="numeric">
                <input type="text" class="otp-input flex-1 h-16 text-center text-2xl font-bold border-2 border-gray-200 rounded-xl focus:border-vermillion outline-none bg-gray-50 focus:bg-white transition" maxlength="1" pattern="[0-9]*" inputmode="numeric">
                <input type="text" class="otp-input flex-1 h-16 text-center text-2xl font-bold border-2 border-gray-200 rounded-xl focus:border-vermillion outline-none bg-gray-50 focus:bg-white transition" maxlength="1" pattern="[0-9]*" inputmode="numeric">
            </div>
            
            <button onclick="window.location.href='dashboard.html'" class="w-full bg-vermillion text-white font-bold py-4 rounded-xl shadow-md shadow-red-200 active:scale-95 transition">
                Verify & Login
            </button>
        </div>
    </div>

    <script>
        function showOtp() {
            document.getElementById('step-1').classList.add('hidden');
            document.getElementById('step-2').classList.remove('hidden');
            document.querySelector('.otp-input').focus();
        }

        // Auto-advance OTP inputs
        const inputs = document.querySelectorAll('.otp-input');
        inputs.forEach((input, index) => {
            input.addEventListener('input', function() {
                if (this.value.length === 1 && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
            });
            input.addEventListener('keydown', function(e) {
                if (e.key === 'Backspace' && !this.value && index > 0) {
                    inputs[index - 1].focus();
                }
            });
        });
    </script>
</body>
</html>
